name: Deploy to Amazon EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://scholarly.namatechnologlies.com/v1
          NEXT_PUBLIC_COMPANY_PHONE_NUMBER: +1 646 480 6092
          NEXT_PUBLIC_SITE_URL: https://scholarlyhelp.com/
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 772400319491-nvr9lgmaphm8cs8udslad1opjct0mam5.apps.googleusercontent.com
          NEXT_PUBLIC_NGROX_URL: https://scholarly.namatechnologlies.com/v1
          # Agentic platform (powers Tutor / Micro Learning / Exam Prep agents).
          # NEXT_PUBLIC_* are inlined at build time, so they must be present here.
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GHL_AUTHORIZATION_TOKEN: ${{ secrets.GHL_AUTHORIZATION_TOKEN }}
          GHL_CGPA_CUSTOM_FIELD_ID: ${{ secrets.GHL_CGPA_CUSTOM_FIELD_ID }}

          # Directus Security Keys (from directus-keys.txt)
          DIRECTUS_KEY: ${{ secrets.DIRECTUS_KEY }}
          DIRECTUS_SECRET: ${{ secrets.DIRECTUS_SECRET }}

          # Directus Admin Credentials (for initial setup)
          DIRECTUS_ADMIN_EMAIL: ${{ secrets.DIRECTUS_ADMIN_EMAIL }}
          DIRECTUS_ADMIN_PASSWORD: ${{ secrets.DIRECTUS_ADMIN_PASSWORD }}

          # Gemini API Key
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_ID: ${{ secrets.GEMINI_MODEL_ID }}
          
          GOOGLE_CLIENT_TOOL_EMAIL: toolsheet@scholarlyhelp.iam.gserviceaccount.com
          GOOGLE_PRIVATE_TOOL_KEY: "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQDp1abIU2VaBS0c\nKIBgshwbDYg9F+qmDeiOQxikAFvMvyvaZax1kqzcsdiYwa+uVjR5VjSCWD3hlH2g\nb0VN5/FxECA8s+6XYBESwW/4LJo/NdD6RcnT4yLnEcKUiWl6OZzUlT9hytwHLrBj\nrSA7gU0x2hkb1aYvq+QwdAEee2gzUaCbwcNsqHucRESJzX9OQWSgPWWBGcDf5Uy8\nnc30PaiyA0aLyq563QARWFkTzDm7y287zEbyu1//c3UpYBjTQR/LC9k9nEoE0Ln8\nl6SVFiRtxNsCp8EJEGEH+tmAfRDncbUSTGMY+J5fq7jKjYFpeyunL/i2XTC9DV7o\nQtX6rX0lAgMBAAECggEAImjaPihnhbO1S6t6GMCc+i4nmjXmxcDONAEToy6aU6re\nHSlRE4wd++v/35rA63qsBh71YyjxEjzzr6QwIqK7GNQyqjwgJA5y9Luaan7Fw/97\nXRjf9lo6TJ6Eb6844k+QEIhV52Ietr/cHQ7g62C/p1Jc14e9CM7WqXqon3+xebuF\nRsDioklPKAKcHWhb0kwKwMTDnBZKmBA9X3IDavnU962Uhnhve+WzakWp4kQ/pove\nzFaCp/l7TOD2Q2dV2AO4xMzSPLgY4FazVY3ta2Tgn5uMv2CiuYsA/HqoO7wD7IZt\nZhRGWmqQ8Yc5h6xCtbrdgsbEE1sEoPf5Eut8veqyAQKBgQD84oUl+rbuYwm/j+at\nzEd7h83+VuqrvoyZgPBfoFn20gDfRignn1zoik7BRHymoAoBJVwTZ52qugnYh/cc\nc+2iYN3VS4oaXFhoER06xeEkv7FkJ89Mri85pEpnVL5ZgVNrBnW/GXEJphMNRMmJ\nkyB1sZyeHoYo/PDN8e+DbW/URQKBgQDstw5IoRbIVK6tUvleBQGHEd1lOx9L9nsQ\nd696gxs6fRaSfGXzyg4t03VckC7tLlmM39O3/XffyWMoWousb6LkShI4yEfDxIND\n5bYB7iaOzDn/iXmUeD7X+wFWE2xUbL7IR+RTjGf00L04jw/S1XaM0vQdRVy2GS4+\nfV8eD8BDYQKBgFKkEBEmSqvCz8e7Vg5L6LxU2Bua+dugTMBJY8RMWboQTNqqSasR\nKEKSGESOhhHJ0Rsow1tQDDVj0J3jaPzyYaEj+LqgkgQlU3rGxP+U9QuWXXk2jUco\n0SQMLYhxKDeFzOX32XjW7prRm/5FEXuVChGMNntxzDQO3P7gZn5TwCzlAoGAPHTc\nPwx1ZyDJpBbG/Y5Fv5t+cfZRnfMLpz8KID4P3DZKZ4tB9quqR2X0WXmxon3t/R7F\nUf54eT1UB+BoP9gbQDbyxHHScltkMxkeDQwn6NycC3mvBY5Yboz64GMBjeZgK4LA\n+92mR05wpVtUbUJ7jqfqFPe8H/36Y5ddja30KsECgYEAyb4IeOUV+Ltfx8lsrfM2\nTlVOssS2LKEDb5U4gVwZoS6kC2iFT3W5gbR2SHK4dvpd2cwNa+x4zuLrwMYraPXo\nwPoKin5FHuzgliIRvqM5j5k1k6dwYfCiYOkumzwi+MGz7B1g9IcDqus00Dq3M0OG\n3PB+LpZzkIlNWH44nAES38A=\n-----END PRIVATE KEY-----\n"
          GOOGLE_SHEET_TOOL_ID: 1GObnuYilA-eTpAxEY-8nHVIuT2qFlE93ii-v4ISDNdc
          
      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r .next deploy/
          cp -r public deploy/
          cp -r node_modules deploy/
          cp package.json deploy/
          cp package-lock.json deploy/
          cp next.config.js deploy/
          tar -czf deploy.tar.gz -C deploy .

      - name: Deploy to Amazon EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_ID: ${{ secrets.GEMINI_MODEL_ID }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

          # Copy deployment package to EC2
          scp -i ~/.ssh/deploy_key deploy.tar.gz $EC2_USER@$EC2_HOST:/tmp/

          # Execute deployment commands on EC2
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST "APP_DIR='$APP_DIR' GEMINI_API_KEY='$GEMINI_API_KEY' GEMINI_MODEL_ID='$GEMINI_MODEL_ID' bash -s" << 'EOF'
            # Ensure PATH includes where pm2 is installed
            export PATH=$PATH:/home/ubuntu/.nvm/versions/node/v24.12.0/bin
            
            # Navigate to application directory
            cd $APP_DIR || exit 1

            # Stop the application (if using PM2)
            pm2 stop scholarly-help || true
            pm2 delete scholarly-help || true

            # Create new directory and extract
            mkdir -p current
            tar -xzf /tmp/deploy.tar.gz -C current/
            cd current

            # Set environment variables (if .env file exists on server)
            if [ -f ../.env ]; then
              cp ../.env .env
            fi

            # Ensure Gemini runtime keys exist for server-side API calls
            touch .env
            sed -i '/^GEMINI_API_KEY=/d' .env
            sed -i '/^GEMINI_MODEL_ID=/d' .env
            {
              echo "GEMINI_API_KEY=$GEMINI_API_KEY"
              echo "GEMINI_MODEL_ID=$GEMINI_MODEL_ID"
            } >> .env

            # Start the application with PM2
            pm2 start npm --name "scholarly-help" -- start
            pm2 save

            # Cleanup
            rm /tmp/deploy.tar.gz
          EOF

          # Cleanup local SSH key
          rm ~/.ssh/deploy_key
